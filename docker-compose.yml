# Journaux Docker plafonnés (sans cela, json-file grossit sans limite) : 3 fichiers de 10 Mo par service
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jarvis:
    build: .
    # Une seule image pour les deux services (le second build est servi par le cache, rien n'est stocké en double)
    image: jarvis:latest
    logging: *logging
    # Redémarre après un plantage ou un redémarrage du serveur ; santé vérifiée par le HEALTHCHECK du Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      # Page « À faire » du cockpit : le dépôt en lecture seule, pour comparer le code qui tourne à celui du disque
      # (git pull sans reconstruction) et le commit du disque à main sur GitHub (PR pas encore déployées)
      - ./:/repo:ro
    # Accessible seulement depuis le serveur lui-même (pas d'accès public aux routes)
    ports:
      - "127.0.0.1:8000:8000"

  # Labo de performance : rejeu historique et trades simulés (python -m app.lab.worker).
  # Même image, même .env et même dossier data/ ; aucun port, un seul cœur pour laisser JARVIS réactif.
  jarvis-lab:
    build: .
    image: jarvis:latest
    logging: *logging
    command: python -m app.lab.worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    cpus: "1.0"
    mem_limit: 1500m
    # Le worker n'a pas de serveur web : santé = battement (lab.heartbeat, à côté de JARVIS_LAB_DB) rafraîchi
    # après chaque étape (lot de bougies, jour rejoué, passage) ; 30 min sans battement = boucle bloquée
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p=os.path.join(os.path.dirname(os.getenv('JARVIS_LAB_DB','data/lab.db')) or '.','lab.heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 1800 else 1)"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 3
