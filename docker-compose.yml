services:
  jarvis:
    build: .
    # Redémarre après un plantage ou un redémarrage du serveur ; santé vérifiée par le HEALTHCHECK du Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # Accessible seulement depuis le serveur lui-même (pas d'accès public aux routes)
    ports:
      - "127.0.0.1:8000:8000"
