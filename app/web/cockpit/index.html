<!doctype html>
<html lang="fr" data-space="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS · Trading Cockpit</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="manifest" href="/cockpit-static/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/cockpit-static/icon.svg">
<link rel="apple-touch-icon" href="/cockpit-static/icon-180.png">
<link rel="preload" href="/cockpit-static/fonts/geist-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/cockpit-static/fonts/geist-mono-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/cockpit/app.css?v={{app.css}}">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"></div>
<div class="sweep" aria-hidden="true"></div>

<div class="app">
  <aside class="rail" aria-label="Navigation">
    <div class="brand">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <div class="brand-txt">
        <div class="brand-name">JARVIS</div>
        <div class="brand-sub">Actions US · Crypto</div>
      </div>
    </div>
    <nav class="nav" id="nav"><span class="nav-ind" id="nav-ind" aria-hidden="true"></span></nav>
    <div class="rail-foot">
      <button class="rail-cta" type="button" data-act="palette" id="cta-palette"><span class="t">Commandes</span><span class="kbd" data-modk>Ctrl K</span></button>
      <button class="rail-cta" type="button" data-act="help" id="cta-help"><span class="t">Raccourcis</span><span class="kbd">?</span></button>
      <a class="rail-link" href="/cockpit/labo">Page Labo</a>
      <a class="rail-link" href="/cockpit/ancien">Ancien cockpit</a>
    </div>
  </aside>

  <div class="stage">
    <header class="topbar">
      <div class="view-title"><h1 id="view-h">Cockpit</h1><span class="sub" id="view-sub">Vue d'ensemble</span></div>
      <button class="search" type="button" data-act="palette" id="search-btn" aria-label="Rechercher ou lancer une commande"><span class="t">Ticker, vue ou commande…</span><span class="kbd" data-modk>Ctrl K</span></button>
      <div class="status">
        <span class="pill hb" id="jarvis-pill" title="Dernier passage du suivi des trades"><span class="dot"></span><span id="jarvis-txt">JARVIS · connexion…</span></span>
        <span class="pill hb lab-pill" id="lab-pill" title="Battement du labo"><span class="dot"></span><span id="lab-txt">Labo</span></span>
        <span class="clock" id="clock" title="Heure de Paris">—</span>
      </div>
      <div class="space" role="group" aria-label="Espace affiché (touche M)">
        <span class="space-thumb" aria-hidden="true"></span>
        <button type="button" id="sp-trades" aria-pressed="false">Mes trades</button>
        <button type="button" id="sp-paper" aria-pressed="true">Papier <span class="kbd">M</span></button>
      </div>
    </header>

    <div class="live-strip" role="status" aria-live="polite"><b>MES TRADES · IBKR</b><span>Positions réelles passées par toi chez IBKR et déclarées à JARVIS. Le cockpit n'envoie aucun ordre.</span></div>
    <div class="banner" id="banner" role="alert" hidden></div>

    <main id="main">
      <section class="view" id="v-cockpit" data-view="cockpit"></section>
      <section class="view" id="v-afaire" data-view="afaire" hidden></section>
      <section class="view" id="v-marches" data-view="marches" hidden></section>
      <section class="view" id="v-positions" data-view="positions" hidden></section>
      <section class="view" id="v-risque" data-view="risque" hidden></section>
      <section class="view" id="v-labo" data-view="labo" hidden></section>
      <section class="view" id="v-agenda" data-view="agenda" hidden></section>
      <section class="view" id="v-journal" data-view="journal" hidden></section>
      <section class="view" id="v-sante" data-view="sante" hidden></section>
    </main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>

<div class="scrim" id="scrim"></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Palette de commandes">
  <div class="pal-in"><span class="pal-ico" id="pal-ico" aria-hidden="true"></span>
    <input id="pal-q" type="text" placeholder="Aller à, ouvrir un ticker, lancer une action…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-list"><span class="kbd">Échap</span></div>
  <div class="pal-list" id="pal-list" role="listbox" aria-label="Résultats"></div>
  <div class="pal-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span> naviguer</span><span><span class="kbd">Entrée</span> lancer</span><span><span class="kbd">Échap</span> fermer</span></div>
</div>
<aside class="drawer" id="drawer" aria-label="Inspecteur d'instrument"></aside>
<div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-h"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div>
<div class="help" id="help" role="dialog" aria-modal="true" aria-label="Raccourcis clavier"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="chord" id="chord" aria-live="polite"></div>

<script src="/cockpit-static/vendor/lightweight-charts-5.0.8.standalone.production.js"></script>
<script src="/cockpit/app.js?v={{app.js}}"></script>
</body>
</html>
